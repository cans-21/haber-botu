# v4
name: Son Dakika Haber Botu

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:
  push:
    paths:
      - 'seen_ids.json'

concurrency:
  group: haber-botu
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  haber-kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GH_TOKEN_PAT: ${{ secrets.GH_TOKEN_PAT }}
          GH_REPO: ${{ secrets.GH_REPO }}
        run: python main.py

      - name: Durum dosyasını depoya kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Haber durumu güncellendi"
          file_pattern: seen_ids.json
          push_options: '--force-with-lease'
