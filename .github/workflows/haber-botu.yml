name: Son Dakika Haber Botu

on:
  schedule:
    # Her 5 dakikada bir çalışır (UTC saatine göre).
    # GitHub, yoğunluğa göre birkaç dakika gecikmeli tetikleyebilir, bu normaldir.
    - cron: "*/5 * * * *"
  # Bunu eklemek, GitHub'ın "Actions" sekmesinden botu manuel olarak
  # da (butona basarak) çalıştırabilmeni sağlar - test için kullanışlı.
  workflow_dispatch:

# seen_ids.json dosyasını depoya geri yazabilmek için gerekli izin.
permissions:
  contents: write

jobs:
  haber-kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Durum dosyasını depoya kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Haber durumu güncellendi"
          file_pattern: seen_ids.json
